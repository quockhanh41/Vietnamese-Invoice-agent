name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Postgres THẬT, không sqlite/mock. Cả dự án này đứng trên hành vi thật
      # của Postgres — CHECK constraint, REVOKE, schema isolation, checkpointer.
      # Test trên sqlite là test một hệ thống khác.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice_agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_agent"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://invoice:invoice@localhost:5433/invoice_agent
      # KHÔNG có API key nào trong CI, và đó là chủ ý: LLM_MODE=replay đọc
      # fixture cache thay vì gọi mạng (design doc §11.4). CI xanh mà không có
      # secret nghĩa là fork PR cũng chạy được test, và test không thể hỏng vì
      # rate limit của người khác.
      LLM_MODE: replay
      LANGFUSE_TRACING_ENABLED: "false"
      # Gate M1 đòi 10/10. Local mặc định 3 cho vòng lặp nhanh; CI chạy đủ.
      # `test_ci_runs_the_full_ten` chặn việc dòng này bị gỡ mà không ai biết.
      HITL_RUNS: "10"


    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks cần lịch sử để quét commit, không chỉ cây làm việc.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (từ lock, không resolve lại)
        run: |
          uv venv --python 3.13
          uv pip sync requirements.lock
          uv pip install -e ".[dev]" --no-deps

      - name: Init schemas app + langgraph
        # `services:` không chạy docker-entrypoint-initdb.d, nên init_db.sql
        # phải được áp thủ công ở đây.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=invoice psql -h localhost -p 5433 -U invoice -d invoice_agent -v ON_ERROR_STOP=1 -f scripts/init_db.sql

      - name: Migrate (alembic upgrade head)
        # `init_db.sql` chỉ tạo SCHEMA rỗng, không tạo bảng nào. Không có bước
        # này thì `app.spike_counter` không tồn tại và mọi test chạm Postgres
        # đỏ với "relation does not exist". Local không lộ ra vì `make dev` đã
        # gọi migrate hộ; CI thì không có `make dev`.
        run: .venv/bin/alembic upgrade head

      # `.venv/bin/…` chứ KHÔNG phải `uv run …`: trong thư mục có pyproject.toml
      # `[project]`, `uv run` vào project mode, sinh `uv.lock` và **re-resolve
      # từ pyproject** — tức là ném đi cái `uv pip sync requirements.lock` ở
      # trên và cài version khác. Đo được 2026-07-26: uv run tạo uv.lock 497KB.
      # Lock chỉ có nghĩa nếu không ai resolve lại sau nó.
      # Cùng lệnh với Makefile, nên CI chạy đúng thứ dev chạy.
      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests migrations

      - name: Typecheck (mypy)
        run: .venv/bin/mypy

      - name: Test (pytest)
        run: .venv/bin/python -m pytest

  secrets:
    # Job riêng: rò key là lỗi bảo mật, không phải lỗi test. Tách ra thì log
    # đọc rõ hơn và job này không bị bỏ qua khi test đỏ.
    #
    # Bài học từ Project A: `.claude/settings.json` ở đó chứa
    # LANGFUSE_SECRET_KEY plaintext. May là `.claude/` đã bị gitignore nên key
    # chưa vào history — nhưng đó là may, không phải thiết kế.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks quét lịch sử, không phải cây làm việc — cần full history.
          fetch-depth: 0

      # CLI trực tiếp, KHÔNG dùng `gitleaks/gitleaks-action@v2`.
      #
      # Action đó quét theo *range của từng push*: nó dựng
      #   --log-opts=--no-merges --first-parent <commits[0].id>^..<head>
      # Hai hệ quả, cả hai đều đã cắn repo này:
      #
      # 1. Push đầu tiên chứa commit gốc, mà commit gốc không có parent →
      #    `<root>^` là revision không tồn tại → job đỏ. Đây chính là lỗi CI
      #    ngày 2026-07-26.
      # 2. Cách vá bằng `BASE_REF` làm baseRef == headRef, và khi đó action
      #    chuyển sang `--log-opts=-1` → quét ĐÚNG MỘT commit. Commit gốc
      #    (33 file) không bao giờ được quét, và vì push handler chỉ nhìn
      #    range của chính nó, sẽ không push nào quét nó nữa. `before` cũng
      #    là 0000… ở MỌI lần push branch mới, nên lỗ này lặp lại chứ không
      #    phải chỉ xảy ra một lần.
      #
      # `gitleaks detect` không kèm --log-opts quét TOÀN BỘ history. Với repo
      # cỡ này tốn dưới 1 giây, và không có edge case nào để nhớ.
      # Exit code 1 khi tìm thấy leak → job đỏ, đúng mong muốn.
      - name: gitleaks (toàn bộ history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact -v
